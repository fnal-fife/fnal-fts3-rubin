name: Build Docker image

on:
  workflow_dispatch:
    inputs:
      tag_override:
        description: 'Tag or version override'
        required: false
        type: string
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_override || github.event.release.tag_name || github.ref_name }}

      - name: Determine configuration from tag
        id: set-env
        run: |
          TAG="${{ inputs.tag_override || github.event.release.tag_name || github.ref_name }}"

          case "$TAG" in
            server-*)
              IMAGE_NAME="${{ github.repository_owner }}/fts3-server"
              DOCKERFILE_PATH="docker/fts3-server/Containerfile"
              BUILD_CONTEXT="docker/fts3-server"
              ;;
            rest-*)
              IMAGE_NAME="${{ github.repository_owner }}/fts3-rest"
              DOCKERFILE_PATH="docker/fts3-rest/Containerfile"
              BUILD_CONTEXT="docker/fts3-rest"
              ;;
            monitoring-*)
              IMAGE_NAME="${{ github.repository_owner }}/fts3-mon"
              DOCKERFILE_PATH="docker/fts3-mon/Containerfile"
              BUILD_CONTEXT="docker/fts3-mon"
              ;;
            activemq-*)
              IMAGE_NAME="${{ github.repository_owner }}/fts3-activemq"
              DOCKERFILE_PATH="docker/fts3-activemq/Containerfile"
              BUILD_CONTEXT="docker/fts3-activemq"
              ;;
            *)
              echo "::error::Tag '$TAG' does not match any recognized service prefix."
              exit 1
              ;;
          esac

          PATTERN="^(server|rest|monitoring|activemq)-([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+\.[0-9]+\.[0-9]+)$"
          
          if [[ "$TAG" =~ $PATTERN ]]; then
            SERVICE_NAME="${BASH_REMATCH[1]}"
            APP_VERSION="${BASH_REMATCH[2]}"
            IMAGE_VERSION="${BASH_REMATCH[3]}"
            
            # Export values to GITHUB_ENV
            echo "SERVICE_NAME=$SERVICE_NAME" >> $GITHUB_ENV
            echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
            echo "IMAGE_VERSION=$IMAGE_VERSION" >> $GITHUB_ENV
            
            echo "Extracted Service: $SERVICE_NAME, App: $APP_VERSION, Image: $IMAGE_VERSION"
          else
            echo "Error: Tag '$TAG' does not match the expected format."
            exit 1
          fi

          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "DOCKERFILE_PATH=$DOCKERFILE_PATH" >> $GITHUB_ENV
          echo "BUILD_CONTEXT=$BUILD_CONTEXT" >> $GITHUB_ENV
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Build (and optionally push) image
        uses: lsst-sqre/build-and-push-to-ghcr@v1
        id: build
        with:
          image: ${{ env.IMAGE_NAME }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dockerfile: ${{ env.DOCKERFILE_PATH }}
          context: ${{ env.BUILD_CONTEXT }}
          push: true               # set to true when you really want to push
          platforms: linux/amd64
          build-args: |
            IMAGE_VERSION=${{ env.IMAGE_VERSION }}
          additional-tags: |
            ${{ github.event.sha }}
            ${{ env.IMAGE_TAG }}
