name: Build Docker image

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Determine configuration from tag
        id: set-env
        run: |
          TAG="${{ github.event.release.tag_name || env.TEST_TAG }}"

          case "$TAG" in
            server-*)
              IMAGE_NAME="${{ github.repository_owner }}/server"
              DOCKERFILE_PATH="services/server/Dockerfile"
              BUILD_CONTEXT="services/server"
              ;;
            rest-v*)
              IMAGE_NAME="${{ github.repository_owner }}/rest"
              DOCKERFILE_PATH="services/rest/Dockerfile"
              BUILD_CONTEXT="services/rest"
              ;;
            monitoring-*)
              IMAGE_NAME="${{ github.repository_owner }}/monitoring"
              DOCKERFILE_PATH="services/monitoring/Dockerfile"
              BUILD_CONTEXT="services/monitoring"
              ;;
            activemq-*)
              IMAGE_NAME="${{ github.repository_owner }}/activemq"
              DOCKERFILE_PATH="services/activemq/Dockerfile"
              BUILD_CONTEXT="services/activemq"
              ;;
            *)
              echo "::error::Tag '$TAG' does not match any recognized service prefix."
              exit 1
              ;;
          esac

          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "DOCKERFILE_PATH=$DOCKERFILE_PATH" >> $GITHUB_ENV
          echo "BUILD_CONTEXT=$BUILD_CONTEXT" >> $GITHUB_ENVname: Build docker images

      - name: Build (and optionally push) image
        uses: lsst-sqre/build-and-push-to-ghcr@v1
        id: build
        with:
          image: ${{ env.IMAGE_NAME }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dockerfile: ${{ env.DOCKERFILE_PATH }}
          context: ${{ env.BUILD_CONTEXT }}
          push: false               # set to true when you really want to push
          platforms: linux/amd64
          additional-tags: ${{ github.event.sha }}
